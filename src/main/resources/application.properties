spring.application.name=macchina
spring.datasource.url=jdbc:mysql://localhost:3306/car_spring
spring.datasource.password=password
spring.datasource.username=root

#crea il db ad ogni avvio
spring.jpa.hibernate.ddl-auto=create
#inizializza sempre db di ogni tipo (altre opzioni sono embedded)
spring.sql.init.mode=always
#effettua gli insert in data.sql dopo i create
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql= true